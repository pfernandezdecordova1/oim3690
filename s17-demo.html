<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic querySelector Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: darkblue;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Template Literal Demo</h1>
    <p>Click the button to see string concatenation vs template literals.</p>
    <button id="showDemo">Show Demo</button>

    <div id="output"></div>

    <script>
        const button = document.querySelector("#showDemo");
        const output = document.querySelector("#output");

        button.addEventListener("click", () => {
            const name = "Alice";
            const age = 25;

            // Old way (concatenation)
            let msg1 = "Hello, " + name + "! You are " + age + ".";

            // New way (template literals)
            let msg2 = `Hello, ${name}! You are ${age}.`;

            // Multi-line string
            let html = `
                <div>
                    <h2>${name}</h2>
                    <p>Age: ${age}</p>
                </div>
            `;

            output.innerHTML = `
                <p><strong>Old way:</strong> ${msg1}</p>
                <p><strong>New way:</strong> ${msg2}</p>
                <hr>
                <p><strong>Multi-line HTML:</strong></p>
                ${html}
            `;
        });
    </script>
</body>
</html>
