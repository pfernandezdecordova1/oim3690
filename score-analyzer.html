<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Analyzer</title>
</head>
<body>
    <h3>Stats</h3>
    <p id="stats"></p>

    <h3>Score Bars</h3>
    <div id="bars"></div>

    <script>
        const scores = [88, 72, 95, 63, 81, 56, 90];

        let total = 0;
        let highest = scores[0];
        let lowest = scores[0];
        let passing = 0;

        for (let i = 0; i < scores.length; i++) {
            total += scores[i];
            if (scores[i] > highest) {
                highest = scores[i];
            }
            if (scores[i] < lowest) {
                lowest = scores[i];
            }
            if (scores[i] >= 60) {
                passing++;
            }
        }

        const average = (total / scores.length).toFixed(1);
        const stats = document.querySelector("#stats");
        stats.innerHTML = `Total scores: ${scores.length}<br>
            Average: ${average}<br>
            Highest: ${highest}<br>
            Lowest: ${lowest}<br>
            Passing: ${passing}`;

        function getGrade(score) {
            if (score >= 90) {
                return "A";
            } else if (score >= 80) {
                return "B";
            } else if (score >= 70) {
                return "C";
            } else if (score >= 60) {
                return "D";
            } else {
                return "F";
            }
        }

        const bars = document.querySelector("#bars");
        let barsHTML = "";
        for (let i = 0; i < scores.length; i++) {
            const grade = getGrade(scores[i]);
            let color = "red";
            if (grade === "A" || grade === "B") {
                color = "green";
            } else if (grade === "C" || grade === "D") {
                color = "orange";
            }
            barsHTML += `<div style="width:${scores[i]}%; background-color:${color}; color:white; padding:5px; margin-bottom:4px;">
                ${scores[i]} (${grade})</div>`;
        }
        bars.innerHTML = barsHTML;
    </script>
</body>
</html>
