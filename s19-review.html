<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Review Questions From Class</p>
<script>
        let username = prompt("Enter your username:");
        if (!username) {
            username = "Guest";
        }

        document.querySelector("p").textContent = `Hello, ${username}!`;
</script>

</body>
</html>
