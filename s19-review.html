<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="name" placeholder="Name"><br>
    <input type="number" id="age" placeholder="Age"><br>
    <input type="text" id="country" placeholder="Country"><br>
    <button id="button">Check</button>
    <p id="result">result</p>

<script>
        const name = document.getElementById("name");
        const age = document.getElementById("age");
        const country = document.getElementById("country");
        const button = document.getElementById("button");
        const result = document.getElementById("result");

        function canDrink(age, country) {
            if (country.toLowerCase() === "us" || country.toLowerCase() === "usa" || country.toLowerCase() === "united states") {
                return age >= 21;
            } else {
                return age >= 18;
            }
        }

        button.addEventListener("click", () => {
            const userName = name.value || "Guest";
            const userAge = Number(age.value);
            const userCountry = country.value || "Unknown";

            if (canDrink(userAge, userCountry)) {
                result.textContent = `${userName}, YOU ARE ABLE TO DRINK`;
                result.style.color = "green";
            } else {
                result.textContent = `${userName}, YOU ARE NOT ABLE TO DRINK`;
                result.style.color = "red";
            }
        });
</script>

</body>
</html>
