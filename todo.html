<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        #taskInput {
            flex: 1;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: #10b981;
        }

        .input-buttons {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 12px 24px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .urgent-btn {
            background: #f59e0b;
        }

        .urgent-btn:hover {
            background: #d97706;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5em;
            color: white;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .urgent-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .urgent-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #f59e0b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .urgent-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        }

        .urgent-card .task-text {
            font-weight: 600;
            color: #1f2937;
            font-size: 1.1em;
        }

        .urgent-card.completed {
            opacity: 0.6;
            border-left-color: #10b981;
        }

        .urgent-card.completed .task-text {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .task-buttons {
            display: flex;
            gap: 8px;
        }

        .urgent-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .urgent-list ul {
            list-style: none;
        }

        .urgent-list li {
            padding: 16px 20px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .urgent-list li:last-child {
            border-bottom: none;
        }

        .urgent-list li:hover {
            background: #f9fafb;
        }

        .regular-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .regular-list ul {
            list-style: none;
        }

        .regular-list li {
            padding: 16px 20px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .regular-list li:last-child {
            border-bottom: none;
        }

        .regular-list li:hover {
            background: #f0fdf4;
        }

        .regular-list li.completed {
            opacity: 0.6;
        }

        .regular-list li.completed .task-text {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .task-text {
            flex: 1;
            cursor: pointer;
            word-break: break-word;
            color: #1f2937;
        }

        .complete-btn, .delete-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .complete-btn {
            background: #10b981;
            color: white;
        }

        .complete-btn:hover {
            background: #059669;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-message {
            text-align: center;
            color: #9ca3af;
            padding: 40px 20px;
            font-size: 16px;
            background: white;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Grocery List</h1>
            <p>Keep track of what you need to buy</p>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add an ingredient..." 
                autofocus
            >
            <div class="input-buttons">
                <button onclick="addTask(false)">Add</button>
                <button class="urgent-btn" onclick="addTask(true)">Add Urgent</button>
            </div>
        </div>

        <!-- URGENT INGREDIENTS SECTION -->
        <div class="section" id="urgentSection" style="display: none;">
            <div class="section-title">🔥 Urgent Ingredients</div>
            <div class="urgent-cards" id="urgentList"></div>
        </div>

        <!-- REGULAR LIST SECTION -->
        <div class="section">
            <div class="section-title">📋 Shopping List</div>
            <div class="regular-list">
                <ul id="taskList"></ul>
                <div id="emptyMessage" class="empty-message">No items yet. Start adding ingredients!</div>
            </div>
        </div>
    </div>

    <script src="js/todo.js"></script>
</body>
</html>
