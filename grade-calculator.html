<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
</head>
<body>
    Score (0-100): <input type="number" id="score" min="0" max="100"><br>
    <button id="button">Get Grade</button>
    <p id="result">result</p>

<script>
        const score = document.getElementById("score");
        const button = document.getElementById("button");
        const result = document.getElementById("result");

        function getGrade(score) {
            if (score >= 90) {
                return "A";
            } else if (score >= 80) {
                return "B";
            } else if (score >= 70) {
                return "C";
            } else if (score >= 60) {
                return "D";
            } else {
                return "F";
            }
        }

        button.addEventListener("click", () => {
            if (score.value === "") {
                result.textContent = "Please enter a score";
                result.style.color = "black";
                return;
            }

            const scoreInput = Number(score.value);

            if (scoreInput < 0 || scoreInput > 100) {
                result.textContent = "Score must be 0-100";
                result.style.color = "black";
                return;
            }

            const grade = getGrade(scoreInput);
            result.textContent = `Your Grade is: ${grade}`;

            if (grade === "A" || grade === "B") {
                result.style.color = "green";
            } else if (grade === "C") {
                result.style.color = "orange";
            } else {
                result.style.color = "red";
            }
        });
</script>

</body>
</html>
